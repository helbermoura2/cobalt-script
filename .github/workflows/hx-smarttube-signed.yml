name: HX TV 0.3.0 signed release and in-app update
on:
  push:
    branches: [smart-cobalt-hybrid]
    paths:
      - .github/workflows/hx-smarttube-signed.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish-signed:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Verify private signing secrets are configured
        shell: bash
        env:
          HX_SIGNING_BUNDLE_B64: ${{ secrets.HX_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$HX_SIGNING_BUNDLE_B64" ]]; then
            echo "::error::Add private Actions secret HX_SIGNING_BUNDLE_B64. Do not publish the key."
            exit 1
          fi
      - name: Checkout update manifest and source
        uses: actions/checkout@v4
        with:
          ref: smart-cobalt-hybrid
          fetch-depth: 1
      - name: Get successfully compiled unsigned release APK
        uses: actions/download-artifact@v4
        with:
          name: hx-native-androidtv-release-unsigned-0.3.0
          run-id: 44647981222
          repository: helbermoura2/cobalt-script
          github-token: ${{ github.token }}
          path: unsigned
      - name: Sign with permanent key, verify version and fingerprint
        shell: bash
        env:
          HX_SIGNING_BUNDLE_B64: ${{ secrets.HX_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          src=unsigned/HX-TV-Native-0.3.0-unsigned-arm.apk
          dst=release/HX-TV-Native-0.3.0-assinado-arm.apk
          test -s "$src"
          echo '614347d3233dc96e65e393677ef8481391ca13c28290176ecefa791222c66b4f  '"$src" | sha256sum --check --status
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          [[ -x "$bt/apksigner" && -x "$bt/zipalign" && -x "$bt/aapt" ]] || {
            echo "::error::Official Android SDK build tools missing"; exit 1; }
          "$bt/zipalign" -c -v 4 "$src" >/dev/null
          mkdir -p release "$RUNNER_TEMP/hx-private"
          trap 'rm -rf "$RUNNER_TEMP/hx-private"' EXIT
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          payload=json.loads(base64.b64decode(os.environ["HX_SIGNING_BUNDLE_B64"]))
          folder=Path(os.environ["RUNNER_TEMP"]) / "hx-private"
          (folder / "key.p12").write_bytes(base64.b64decode(payload["key_b64"]))
          (folder / "password.txt").write_text(payload["password"], encoding="utf-8")
          (folder / "alias.txt").write_text(payload["alias"], encoding="utf-8")
          for name in ("key.p12","password.txt","alias.txt"):
              (folder/name).chmod(0o600)
          PY
          export HX_KEYSTORE_PASSWORD="$(cat "$RUNNER_TEMP/hx-private/password.txt")"
          export HX_KEY_ALIAS="$(cat "$RUNNER_TEMP/hx-private/alias.txt")"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/hx-private/key.p12" \
            -storepass "$HX_KEYSTORE_PASSWORD" -alias "$HX_KEY_ALIAS" >/dev/null
          "$bt/apksigner" sign \
            --ks "$RUNNER_TEMP/hx-private/key.p12" --ks-type PKCS12 \
            --ks-key-alias "$HX_KEY_ALIAS" \
            --ks-pass env:HX_KEYSTORE_PASSWORD --key-pass env:HX_KEYSTORE_PASSWORD \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$dst" "$src"
          "$bt/apksigner" verify --verbose --print-certs "$dst" > release/signature-report.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' release/signature-report.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' release/signature-report.txt
          expected='1e929c67bf65dd36a8875595f882089f036b4d8c68700a6f4fd70fb23efd86d7'
          actual="$(awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' release/signature-report.txt | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          [[ "$actual" == "$expected" ]] || {
            echo "::error::Different certificate. Refuse publishing incompatible APK"; exit 1; }
          "$bt/aapt" dump badging "$dst" | grep -q "package: name='br.com.hxnative.tvpreview' versionCode='2472' versionName='0.3.0'"
          ! "$bt/aapt" dump badging "$dst" | grep -q '^application-debuggable' || {
            echo "::error::Refusing debuggable APK"; exit 1; }
          "$bt/zipalign" -c -v 4 "$dst" >/dev/null
          sha256sum "$dst" | tee release/checksums.sha256
      - name: Publish signed Android APK (not debug build)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=hx-smarttube-signed-v0.3.0
          name=HX-TV-Native-0.3.0-assinado-arm.apk
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Signed release tag already exists. Do not overwrite it blindly."
            exit 1
          fi
          gh release create "$tag" "release/$name" \
            --repo helbermoura2/cobalt-script \
            --target smart-cobalt-hybrid \
            --title 'HX TV Native 0.3.0 — atualização assinada' \
            --notes 'APK Android TV release, versão 2472, assinado com o mesmo certificado permanente da 0.2.0. Instalar sobre a 0.2.0 sem desinstalar. Tema OLED Bronze Imperial; identidade HX; letreiro rolante preservado. O mecanismo Cobalt ainda não está integrado.'
          mkdir -p verified
          gh release download "$tag" --repo helbermoura2/cobalt-script \
            --pattern "$name" --dir verified
          cmp "release/$name" "verified/$name"
      - name: Activate signed version in the app updater manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path("hybrid/updates/native.json")
          url=("https://github.com/helbermoura2/cobalt-script/releases/download/"
               "hx-smarttube-signed-v0.3.0/HX-TV-Native-0.3.0-assinado-arm.apk")
          data={
            "package": {"downloadUrlList": [url], "downloadUrl": url},
            "0.3.0": {
              "versionCode": 2472,
              "changelog": [
                "Tema HX TV OLED com detalhes Bronze Imperial",
                "Identidade HX nos menus e cabeçalho",
                "Letreiro rolante original mantido",
                "Atualizador nativo com proteção de assinatura",
                "Player SmartTube nativo; integração Cobalt ainda pendente"
              ]
            }
          }
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hybrid/updates/native.json
          git commit -m 'Offer only permanent-signed HX TV 0.3.0 through in-app updater'
          git push origin HEAD:smart-cobalt-hybrid
      - name: Ensure temporary private key is destroyed
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/hx-private"
