name: HX TV 0.9.6 — cinematic discovery and broad topic recommendations
on:
  push:
    branches: [smart-cobalt-hybrid]
    paths:
      - .github/workflows/hx-smarttube-native.yml
      - hybrid/patch_smarttube.py
      - hybrid/patch_hx_design.py
      - hybrid/patch_hx_shell.py
      - hybrid/patch_hx_premium.py
      - hybrid/patch_hx_cinema.py
      - hybrid/patch_hx_editorial.py
      - hybrid/patch_hx_home.py
      - hybrid/native-src/HxHomeScreen.java
      - hybrid/patch_hx_player.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check private signing secret before costly build
        shell: bash
        env:
          HX_SIGNING_BUNDLE_B64: ${{ secrets.HX_SIGNING_BUNDLE_B64 }}
        run: |
          test -n "$HX_SIGNING_BUNDLE_B64" || {
            echo "::error::Missing HX_SIGNING_BUNDLE_B64 secret"; exit 1; }
      - name: Checkout our source patches and updater
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned SmartTube native Android TV code
        uses: actions/checkout@v4
        with:
          repository: yuliskov/SmartTube
          ref: 41fbc7c60ee28e6f13cee74ff630dac6df2724bf
          submodules: recursive
          path: upstream
          persist-credentials: false
      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            upstream/gradle/wrapper/gradle-wrapper.properties
            upstream/build.gradle
      - name: Install supported Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          echo "Android home: $ANDROID_HOME"
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          if [ -z "$SDKMGR" ]; then echo 'SDK manager missing'; exit 1; fi
          echo "Using $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install 'platforms;android-34' 'build-tools;30.0.3' 'ndk;21.0.6113669'
      - name: Prepare icon generator
        run: python3 -m pip install --user --break-system-packages Pillow==11.3.0
      - name: Patch source, package, branding, preview behavior and updater
        run: |
          python3 -m py_compile hybrid/patch_smarttube.py
          python3 -m py_compile hybrid/patch_hx_design.py
          python3 -m py_compile hybrid/patch_hx_shell.py
          python3 -m py_compile hybrid/patch_hx_premium.py
          python3 -m py_compile hybrid/patch_hx_cinema.py
          python3 -m py_compile hybrid/patch_hx_editorial.py
          python3 -m py_compile hybrid/patch_hx_home.py
          python3 -m py_compile hybrid/patch_hx_player.py
          python3 hybrid/patch_smarttube.py upstream
          python3 hybrid/patch_hx_design.py upstream
          python3 hybrid/patch_hx_shell.py upstream
          python3 hybrid/patch_hx_premium.py upstream
          python3 hybrid/patch_hx_cinema.py upstream
          python3 hybrid/patch_hx_editorial.py upstream
          python3 hybrid/patch_hx_home.py upstream
          python3 hybrid/patch_hx_player.py upstream
          grep -q 'restaurarFocoAposReproducao()' upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/browse/BrowseActivity.java
          grep -q 'dispatchKeyEvent(KeyEvent evento)' upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/browse/HxHomeScreen.java
          grep -q 'ATUALIZAR HX TV' upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/browse/HxHomeScreen.java
          grep -q 'native-beta.json' upstream/common/src/stbeta/res/values/update_urls.xml
          python3 -m json.tool hybrid/updates/native-beta.json > /dev/null
          grep -q 'TextView aoVivo=texto' upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/browse/HxHomeScreen.java
          grep -q 'private View primeiroCardValido()' upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/browse/HxHomeScreen.java
          grep -q 'aba.setOnKeyListener' upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/browse/HxHomeScreen.java
          grep -q 'quadro.setOnClickListener' upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/browse/HxHomeScreen.java
          grep -q 'private void setPainelAberto(boolean abrir)' upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/browse/HxHomeScreen.java
          grep -q 'ValueAnimator.ofInt(de,ate)' upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/browse/HxHomeScreen.java
          grep -q 'hx_player_primary_rail' upstream/smarttubetv/src/main/res/layout/lb_playback_transport_controls_row.xml
          grep -q 'hx_player_secondary_rail' upstream/smarttubetv/src/main/res/layout/lb_playback_transport_controls_row.xml
          grep -q 'private void adicionarExplorar()' upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/browse/HxHomeScreen.java
          grep -q 'getSearchObserve(consulta,0)' upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/browse/HxHomeScreen.java
          grep -q 'MAX_VIDEOS_POR_FILEIRA' upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/browse/HxHomeScreen.java
          grep -q 'limitesPorFileira.put' upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/browse/HxHomeScreen.java
          grep -q 'grupoPrincipalId==null' upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/browse/HxHomeScreen.java
          grep -q 'StateListDrawable states' upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/mod/leanback/playerglue/tooltips/ControlButtonPresenterSelector.java
          grep -q 'class HxHomeScreen extends FrameLayout implements BrowseView' upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/browse/HxHomeScreen.java
          grep -q 'setContentView(interfaceHx);' upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/browse/BrowseActivity.java
          grep -q "class HxEditorialRowPresenter extends CustomListRowPresenter" upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/presenter/HxEditorialRowPresenter.java
          grep -q "new HxFeaturedRow" upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/browse/video/MultipleRowsFragment.java
          grep -q "class HxSpotlightCardPresenter extends LongClickPresenter" upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/presenter/HxSpotlightCardPresenter.java
          grep -q 'HX TV  /  EM DESTAQUE' upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/presenter/HxSpotlightCardPresenter.java
          grep -q "setBadgeDrawable(null);" upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/browse/BrowseFragment.java
          grep -q 'lb_browse_rows_margin_start">210dp' upstream/smarttubetv/src/main/res/values/dimens.xml
          grep -q "ZOOM_FACTOR_XSMALL" upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/util/ViewUtil.java
          test -f upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/presenter/HxSpotlightCardPresenter.java
          grep -q 'R.drawable.hx_card_panel_active' upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/presenter/VideoCardPresenter.java
          grep -q 'getPackageArchiveInfo(' upstream/common/src/main/java/com/liskovsoft/smartyoutubetv2/common/app/presenters/dialogs/AppUpdatePresenter.java
          ! grep -q 'apkPath.startsWith(' upstream/common/src/main/java/com/liskovsoft/smartyoutubetv2/common/app/presenters/dialogs/AppUpdatePresenter.java
          python3 -m json.tool hybrid/updates/native.json >/dev/null
          test -z "$(find upstream -name keystore.properties -type f -print -quit)"
          grep -q 'br.com.hxnative.tvpreview' upstream/smarttubetv/build.gradle
          grep -q 'raw.githubusercontent.com/helbermoura2/cobalt-script/smart-cobalt-hybrid' upstream/common/src/stbeta/res/values/update_urls.xml
          grep -q 'hx_update_app' upstream/common/src/main/java/com/liskovsoft/smartyoutubetv2/common/misc/AppDataSourceManager.java
          grep -q '#B5D7FF' upstream/smarttubetv/src/main/res/values/colors.xml
          grep -q 'versionCode 2484' upstream/smarttubetv/build.gradle
      - name: Supply optional Android library typedef metadata for old release plugin
        shell: bash
        run: |
          set -euo pipefail
          # The legacy Android plugin expects this file for each AAR library even when the
          # optional extractReleaseAnnotations task is disabled. The recipe
          # is metadata only; empty means no typedef annotations to package.
          find upstream -name build.gradle -type f -not -path '*/build/*' -print0 |
            while IFS= read -r -d '' gradlefile; do
              module_dir="$(dirname "$gradlefile")"
              metadata_dir="$module_dir/build/intermediates/annotations_typedef_file/release"
              mkdir -p "$metadata_dir"
              : > "$metadata_dir/typedefs.txt"
              flavor_metadata_dir="$module_dir/build/intermediates/annotations_typedef_file/stbetaRelease"
              mkdir -p "$flavor_metadata_dir"
              : > "$flavor_metadata_dir/typedefs.txt"
            done
          test -f upstream/exoplayer-amzn-2.10.6/library/ui/build/intermediates/annotations_typedef_file/release/typedefs.txt
          test -f upstream/doubletapplayerview/build/intermediates/annotations_typedef_file/release/typedefs.txt
      - name: Build real native Android TV APK from SmartTube source
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :smarttubetv:assembleStbetaRelease -x extractReleaseAnnotations -x extractStbetaReleaseAnnotations
      - name: Collect ARM build and validate package
        run: |
          set -euo pipefail
          find upstream/smarttubetv/build/outputs/apk/stbeta/release -name '*.apk' -maxdepth 1 -type f
          apk=$(find upstream/smarttubetv/build/outputs/apk/stbeta/release -name '*armeabi-v7a.apk' -type f | head -n 1)
          if [ -z "$apk" ]; then echo 'ARMv7 APK missing'; exit 1; fi
          mkdir -p out
          cp "$apk" out/HX-TV-Native-0.9.6-unsigned-arm.apk
          sdk="$ANDROID_HOME/build-tools"
          bt=$(ls -d "$sdk"/* | sort -V | tail -n 1)
          "$bt/aapt" dump badging out/HX-TV-Native-0.9.6-unsigned-arm.apk | head -n 15
          "$bt/aapt" dump badging out/HX-TV-Native-0.9.6-unsigned-arm.apk | grep -q "package: name='br.com.hxnative.tvpreview'"
          # This is intentionally unsigned; it must be signed locally with
          # the persistent private HX key, never uploaded as a public release.
          "$bt/zipalign" -c -v 4 out/HX-TV-Native-0.9.6-unsigned-arm.apk
          if "$bt/aapt" dump badging out/HX-TV-Native-0.9.6-unsigned-arm.apk | grep -q '^application-debuggable'; then
            echo 'ERROR: Release APK is debuggable'
            exit 1
          fi
          sha256sum out/HX-TV-Native-0.9.6-unsigned-arm.apk
      - name: Upload backup APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hx-native-androidtv-release-unsigned-0.9.6
          path: out/HX-TV-Native-0.9.6-unsigned-arm.apk
          if-no-files-found: error
      - name: Sign HX 0.9.6 APK with persistent certificate
        shell: bash
        env:
          HX_SIGNING_BUNDLE_B64: ${{ secrets.HX_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          src="out/HX-TV-Native-0.9.6-unsigned-arm.apk"
          dst="out/HX-TV-Native-0.9.6-assinado-arm.apk"
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          [[ -x "$bt/apksigner" && -x "$bt/aapt" && -x "$bt/zipalign" ]] || exit 1
          mkdir -p "$RUNNER_TEMP/hx-private"
          trap 'rm -rf "$RUNNER_TEMP/hx-private"' EXIT
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          bundle = json.loads(base64.b64decode(os.environ["HX_SIGNING_BUNDLE_B64"]))
          directory = Path(os.environ["RUNNER_TEMP"]) / "hx-private"
          (directory / "key.p12").write_bytes(base64.b64decode(bundle["key_b64"]))
          (directory / "password.txt").write_text(bundle["password"], encoding="utf-8")
          (directory / "alias.txt").write_text(bundle["alias"], encoding="utf-8")
          for name in ("key.p12","password.txt","alias.txt"):
              (directory / name).chmod(0o600)
          PY
          export HX_KEYSTORE_PASSWORD="$(cat "$RUNNER_TEMP/hx-private/password.txt")"
          export HX_KEY_ALIAS="$(cat "$RUNNER_TEMP/hx-private/alias.txt")"
          "$bt/apksigner" sign \
            --ks "$RUNNER_TEMP/hx-private/key.p12" --ks-type PKCS12 \
            --ks-key-alias "$HX_KEY_ALIAS" \
            --ks-pass env:HX_KEYSTORE_PASSWORD --key-pass env:HX_KEYSTORE_PASSWORD \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$dst" "$src"
          "$bt/apksigner" verify --verbose --print-certs "$dst" > out/hx04-signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' out/hx04-signature.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' out/hx04-signature.txt
          actual="$(awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' out/hx04-signature.txt | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          expected='1e929c67bf65dd36a8875595f882089f036b4d8c68700a6f4fd70fb23efd86d7'
          [[ "$actual" == "$expected" ]] || {
            echo "::error::Certificado diferente da HX TV 0.3.0. Abortando."
            exit 1
          }
          "$bt/aapt" dump badging "$dst" | grep -q "package: name='br.com.hxnative.tvpreview' versionCode='2484' versionName='0.9.6'"
          ! "$bt/aapt" dump badging "$dst" | grep -q '^application-debuggable' || {
            echo 'Release debuggable forbidden'; exit 1; }
          "$bt/zipalign" -c -v 4 "$dst" >/dev/null
          sha256sum "$dst" > out/HX-TV-Native-0.9.6.sha256
      - name: Publicar APK experimental sem ativar atualização automática
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='hx-tv-independent-v0.9.6-beta'
          apk='HX-TV-Native-0.9.6-assinado-arm.apk'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Já existe uma versão experimental com esse nome."
            exit 1
          fi
          gh release create "$tag" "out/$apk" --prerelease \
            --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" \
            --title 'HX TV 0.9.6 — cinema visual e mais assuntos na home' \
          --notes 'HX TV 0.9.6 BETA: aproxima a tela inicial da referência de catálogo cinematográfico, com fileiras de cards verticais, imagem verdadeira em composição editorial e destaque que muda conforme o foco. Mais vídeos carregados progressivamente em cada fileira; 28 assuntos disponíveis para descobrir conteúdos reais, com pesquisas temáticas da própria fonte e fileiras adicionais sob demanda. Preserva reprodução, contas, histórico, menu retrátil, modos do player, atualizador interno e modo clássico. Mesmo certificado assinado da versão 0.9.5, versionCode 2484. Beta: visual e navegação requerem validação na TCL P7K.'
          mkdir -p test-release
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "$apk" --dir test-release
          cmp "out/$apk" "test-release/$apk"
      # Só liberar a atualização automática depois da publicação e da validação
      # do APK assinado. Dessa forma, a 0.9.2 não recebe link quebrado durante o build.
      - name: Ativar atualização 0.9.6 no botão ATUALIZAR após release válido
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m json.tool hybrid/updates/native-beta-next.json >/dev/null
          gh release view hx-tv-independent-v0.9.6-beta --repo "$GITHUB_REPOSITORY" >/dev/null
          mkdir -p test-release-final
          gh release download hx-tv-independent-v0.9.6-beta --repo "$GITHUB_REPOSITORY" \
            --pattern 'HX-TV-Native-0.9.6-assinado-arm.apk' --dir test-release-final
          cmp out/HX-TV-Native-0.9.6-assinado-arm.apk test-release-final/HX-TV-Native-0.9.6-assinado-arm.apk
          SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/hybrid/updates/native-beta.json?ref=smart-cobalt-hybrid" --jq .sha)"
          DATA="$(base64 -w0 hybrid/updates/native-beta-next.json)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/hybrid/updates/native-beta.json" \
            -f message="chore(hx): activate signed 0.9.6 in-app update after release verification" \
            -f content="$DATA" -f sha="$SHA" -f branch=smart-cobalt-hybrid >/dev/null
          echo "OTA ACTIVATED: Signed HX TV 0.9.6 available via native-beta.json"
      - name: Apagar assinatura temporária do ambiente
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/hx-private"
