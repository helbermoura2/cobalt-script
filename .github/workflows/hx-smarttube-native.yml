name: HX Native Android TV (unsigned release for local signing)
on:
  push:
    branches: [smart-cobalt-hybrid]
    paths:
      - .github/workflows/hx-smarttube-native.yml
      - hybrid/patch_smarttube.py
      - hybrid/patch_hx_design.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout our source patches and updater
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned SmartTube native Android TV code
        uses: actions/checkout@v4
        with:
          repository: yuliskov/SmartTube
          ref: 41fbc7c60ee28e6f13cee74ff630dac6df2724bf
          submodules: recursive
          path: upstream
          persist-credentials: false
      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            upstream/gradle/wrapper/gradle-wrapper.properties
            upstream/build.gradle
      - name: Install supported Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          echo "Android home: $ANDROID_HOME"
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          if [ -z "$SDKMGR" ]; then echo 'SDK manager missing'; exit 1; fi
          echo "Using $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install 'platforms;android-34' 'build-tools;30.0.3' 'ndk;21.0.6113669'
      - name: Prepare icon generator
        run: python3 -m pip install --user --break-system-packages Pillow==11.3.0
      - name: Patch source, package, branding, preview behavior and updater
        run: |
          python3 -m py_compile hybrid/patch_smarttube.py
          python3 -m py_compile hybrid/patch_hx_design.py
          python3 hybrid/patch_smarttube.py upstream
          python3 hybrid/patch_hx_design.py upstream
          python3 -m json.tool hybrid/updates/native.json >/dev/null
          test -z "$(find upstream -name keystore.properties -type f -print -quit)"
          grep -q 'br.com.hxnative.tvpreview' upstream/smarttubetv/build.gradle
          grep -q 'raw.githubusercontent.com/helbermoura2/cobalt-script/smart-cobalt-hybrid' upstream/common/src/stbeta/res/values/update_urls.xml
          grep -q 'hx_update_app' upstream/common/src/main/java/com/liskovsoft/smartyoutubetv2/common/misc/AppDataSourceManager.java
          grep -q '#B68A56' upstream/smarttubetv/src/main/res/values/colors.xml
          grep -q 'versionCode 2472' upstream/smarttubetv/build.gradle
      - name: Build real native Android TV APK from SmartTube source
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :smarttubetv:assembleStbetaRelease -x extractReleaseAnnotations
      - name: Collect ARM build and validate package
        run: |
          set -euo pipefail
          find upstream/smarttubetv/build/outputs/apk/stbeta/release -name '*.apk' -maxdepth 1 -type f
          apk=$(find upstream/smarttubetv/build/outputs/apk/stbeta/release -name '*armeabi-v7a.apk' -type f | head -n 1)
          if [ -z "$apk" ]; then echo 'ARMv7 APK missing'; exit 1; fi
          mkdir -p out
          cp "$apk" out/HX-TV-Native-0.3.0-unsigned-arm.apk
          sdk="$ANDROID_HOME/build-tools"
          bt=$(ls -d "$sdk"/* | sort -V | tail -n 1)
          "$bt/aapt" dump badging out/HX-TV-Native-0.3.0-unsigned-arm.apk | head -n 15
          "$bt/aapt" dump badging out/HX-TV-Native-0.3.0-unsigned-arm.apk | grep -q "package: name='br.com.hxnative.tvpreview'"
          # This is intentionally unsigned; it must be signed locally with
          # the persistent private HX key, never uploaded as a public release.
          "$bt/zipalign" -c -v 4 out/HX-TV-Native-0.3.0-unsigned-arm.apk
          if "$bt/aapt" dump badging out/HX-TV-Native-0.3.0-unsigned-arm.apk | grep -q '^application-debuggable'; then
            echo 'ERROR: Release APK is debuggable'
            exit 1
          fi
          sha256sum out/HX-TV-Native-0.3.0-unsigned-arm.apk
      - name: Upload backup APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hx-native-androidtv-release-unsigned-0.3.0
          path: out/HX-TV-Native-0.3.0-unsigned-arm.apk
          if-no-files-found: error
