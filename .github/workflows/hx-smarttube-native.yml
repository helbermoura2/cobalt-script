          test ! -f upstream/smarttubetv/src/main/res/drawable/hx_player_secondary_rail.xml
          grep -q '0xB05B5B5B' upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/mod/leanback/playerglue/tooltips/ControlButtonPresenterSelector.java
          ! grep -q 'hx_player_primary_rail' upstream/smarttubetv/src/main/res/layout/lb_playback_transport_controls_row.xml
