          grep -q 'android:textSize="12sp"' upstream/smarttubetv/src/main/res/layout/lb_playback_transport_controls_row.xml
          grep -q 'SearchOptions.FEATURE_LIVE' upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/browse/HxHomeScreen.java
          ! grep -q 'focoStory(' upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/browse/HxHomeScreen.java
          grep -q 'Math.round(146f \* d)' upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/playback/PlaybackFragment.java
          grep -q 'private void adicionarDuracao(FrameLayout capa,Video video)' upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/browse/HxHomeScreen.java
          grep -q 'PRETO=0xFF000000' upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/browse/HxHomeScreen.java
          grep -q 'new int\[\]{0x26FFFFFF,cor,0x20000000}' upstream/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/browse/HxHomeScreen.java
