          grep -q 'raw.githubusercontent.com/helbermoura2/cobalt-script/smart-cobalt-hybrid' upstream/common/src/stbeta/res/values/update_urls.xml
          grep -q 'hx_update_app' upstream/common/src/main/java/com/liskovsoft/smartyoutubetv2/common/misc/AppDataSourceManager.java
          grep -q '#BDBDBD' upstream/smarttubetv/src/main/res/values/colors.xml
          ! grep -q '#B5D7FF' upstream/smarttubetv/src/main/res/values/colors.xml
          grep -q 'versionCode 2497' upstream/smarttubetv/build.gradle
      - name: Supply optional Android library typedef metadata for old release plugin
        shell: bash
        run: |
          set -euo pipefail
          # The legacy Android plugin expects this file for each AAR library even when the
          # optional extractReleaseAnnotations task is disabled. The recipe
          # is metadata only; empty means no typedef annotations to package.
          find upstream -name build.gradle -type f -not -path '*/build/*' -print0 |
            while IFS= read -r -d '' gradlefile; do
              module_dir="$(dirname "$gradlefile")"
              metadata_dir="$module_dir/build/intermediates/annotations_typedef_file/release"
              mkdir -p "$metadata_dir"
              : > "$metadata_dir/typedefs.txt"
              flavor_metadata_dir="$module_dir/build/intermediates/annotations_typedef_file/stbetaRelease"
              mkdir -p "$flavor_metadata_dir"
              : > "$flavor_metadata_dir/typedefs.txt"
            done
          test -f upstream/exoplayer-amzn-2.10.6/library/ui/build/intermediates/annotations_typedef_file/release/typedefs.txt
          test -f upstream/doubletapplayerview/build/intermediates/annotations_typedef_file/release/typedefs.txt
      - name: Build real native Android TV APK from SmartTube source
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :smarttubetv:assembleStbetaRelease -x extractReleaseAnnotations -x extractStbetaReleaseAnnotations
      - name: Collect ARM build and validate package
        run: |
          set -euo pipefail
          find upstream/smarttubetv/build/outputs/apk/stbeta/release -name '*.apk' -maxdepth 1 -type f
          apk=$(find upstream/smarttubetv/build/outputs/apk/stbeta/release -name '*armeabi-v7a.apk' -type f | head -n 1)
          if [ -z "$apk" ]; then echo 'ARMv7 APK missing'; exit 1; fi
          mkdir -p out
          cp "$apk" out/HX-TV-Native-0.9.19-unsigned-arm.apk
          sdk="$ANDROID_HOME/build-tools"
          bt=$(ls -d "$sdk"/* | sort -V | tail -n 1)
          "$bt/aapt" dump badging out/HX-TV-Native-0.9.19-unsigned-arm.apk | head -n 15
          "$bt/aapt" dump badging out/HX-TV-Native-0.9.19-unsigned-arm.apk | grep -q "package: name='br.com.hxnative.tvpreview'"
          # This is intentionally unsigned; it must be signed locally with
          # the persistent private HX key, never uploaded as a public release.
          "$bt/zipalign" -c -v 4 out/HX-TV-Native-0.9.19-unsigned-arm.apk
          if "$bt/aapt" dump badging out/HX-TV-Native-0.9.19-unsigned-arm.apk | grep -q '^application-debuggable'; then
            echo 'ERROR: Release APK is debuggable'
            exit 1
          fi
          sha256sum out/HX-TV-Native-0.9.19-unsigned-arm.apk
      - name: Upload backup APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hx-native-androidtv-release-unsigned-0.9.19
          path: out/HX-TV-Native-0.9.19-unsigned-arm.apk
          if-no-files-found: error
      - name: Sign HX 0.9.19 APK with persistent certificate
        shell: bash
        env:
          HX_SIGNING_BUNDLE_B64: ${{ secrets.HX_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          src="out/HX-TV-Native-0.9.19-unsigned-arm.apk"
          dst="out/HX-TV-Native-0.9.19-assinado-arm.apk"
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          [[ -x "$bt/apksigner" && -x "$bt/aapt" && -x "$bt/zipalign" ]] || exit 1
          mkdir -p "$RUNNER_TEMP/hx-private"
          trap 'rm -rf "$RUNNER_TEMP/hx-private"' EXIT
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          bundle = json.loads(base64.b64decode(os.environ["HX_SIGNING_BUNDLE_B64"]))
          directory = Path(os.environ["RUNNER_TEMP"]) / "hx-private"
          (directory / "key.p12").write_bytes(base64.b64decode(bundle["key_b64"]))
          (directory / "password.txt").write_text(bundle["password"], encoding="utf-8")
          (directory / "alias.txt").write_text(bundle["alias"], encoding="utf-8")
          for name in ("key.p12","password.txt","alias.txt"):
              (directory / name).chmod(0o600)
          PY
          export HX_KEYSTORE_PASSWORD="$(cat "$RUNNER_TEMP/hx-private/password.txt")"
          export HX_KEY_ALIAS="$(cat "$RUNNER_TEMP/hx-private/alias.txt")"
          "$bt/apksigner" sign \
            --ks "$RUNNER_TEMP/hx-private/key.p12" --ks-type PKCS12 \
            --ks-key-alias "$HX_KEY_ALIAS" \
            --ks-pass env:HX_KEYSTORE_PASSWORD --key-pass env:HX_KEYSTORE_PASSWORD \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$dst" "$src"
          "$bt/apksigner" verify --verbose --print-certs "$dst" > out/hx04-signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' out/hx04-signature.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' out/hx04-signature.txt
          actual="$(awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' out/hx04-signature.txt | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          expected='1e929c67bf65dd36a8875595f882089f036b4d8c68700a6f4fd70fb23efd86d7'
          [[ "$actual" == "$expected" ]] || {
            echo "::error::Certificado diferente da HX TV 0.3.0. Abortando."
            exit 1
          }
          "$bt/aapt" dump badging "$dst" | grep -q "package: name='br.com.hxnative.tvpreview' versionCode='2497' versionName='0.9.19'"
          ! "$bt/aapt" dump badging "$dst" | grep -q '^application-debuggable' || {
            echo 'Release debuggable forbidden'; exit 1; }
          "$bt/zipalign" -c -v 4 "$dst" >/dev/null
          sha256sum "$dst" > out/HX-TV-Native-0.9.19.sha256
      - name: Publicar APK experimental sem ativar atualização automática
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='hx-tv-independent-v0.9.19-beta'
          apk='HX-TV-Native-0.9.19-assinado-arm.apk'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Já existe uma versão experimental com esse nome."
            exit 1
          fi
          gh release create "$tag" "out/$apk" --prerelease \
            --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" \
            --title 'HX TV 0.9.19 Black Glass — nova tela de Inscrições' \
            --notes 'Prévia do novo layout Black Glass com grade de quatro colunas, foco ciano, navegação lateral e atalhos no cabeçalho. A prévia requer validação na TCL P7K.'
          mkdir -p test-release
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "$apk" --dir test-release
          cmp "out/$apk" "test-release/$apk"
