          grep -q 'getPackageArchiveInfo(' upstream/common/src/main/java/com/liskovsoft/smartyoutubetv2/common/app/presenters/dialogs/AppUpdatePresenter.java
          ! grep -q 'apkPath.startsWith(' upstream/common/src/main/java/com/liskovsoft/smartyoutubetv2/common/app/presenters/dialogs/AppUpdatePresenter.java
          python3 -m json.tool hybrid/updates/native.json >/dev/null
